<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Construction Calculators</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; padding: 20px; background: #f5f6f8; color: #222; }
    .calculator { background: white; padding: 25px; border-radius: 12px; }
    input { display: block; width: 100%; box-sizing: border-box; padding: 12px; margin: 8px 0 16px; }
    button { padding: 12px 20px; background: #245b46; color: white; border: none; border-radius: 6px; cursor: pointer; }
    #result { font-size: 22px; font-weight: bold; }
  </style>
</head>
<body>
  <h1>Construction Calculators</h1>
  <p>Simple calculators for your construction projects.</p>
  <div class="calculator">
    <h2>Concrete Slab Calculator</h2>
    <label for="length">Length (feet)</label>
    <input id="length" type="number" min="0" step="any">
    <label for="width">Width (feet)</label>
    <input id="width" type="number" min="0" step="any">
    <label for="thickness">Thickness (inches)</label>
    <input id="thickness" type="number" min="0" step="any">
    <button onclick="calculate()">Calculate</button>
    <p id="result" aria-live="polite"></p>
  </div>
  <script>
    function calculate() {
      const l = Number(document.getElementById('length').value);
      const w = Number(document.getElementById('width').value);
      const t = Number(document.getElementById('thickness').value);
      const result = document.getElementById('result');
      if (l <= 0 || w <= 0 || t <= 0) {
        result.textContent = 'Enter positive dimensions.';
        return;
      }
      const yards = l * w * (t / 12) / 27;
      result.textContent = 'Concrete needed: ' + yards.toFixed(2) + ' cubic yards';
    }
  </script>
</body>
</html>
